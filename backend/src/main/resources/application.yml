server:
  port: 8080

spring:
  application:
    name: codejunk-backend
  jackson:
    default-property-inclusion: non_null

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/codejunk}
    username: ${SPRING_DATASOURCE_USERNAME:codejunk}
    password: ${SPRING_DATASOURCE_PASSWORD:codejunk}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks it matches the entities.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors:
    # Angular dev server; empty in Docker Compose where nginx proxies /api.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.codejunk: INFO
