<section class="collapsible" [class.open]="expanded()">
  <button type="button" class="header" (click)="toggle()" [attr.aria-expanded]="expanded()">
    <span class="chevron" aria-hidden="true">{{ expanded() ? '▾' : '▸' }}</span>
    {{ title() }}
  </button>

  <div class="body" [hidden]="!expanded()">
    <ng-content />
  </div>
</section>
